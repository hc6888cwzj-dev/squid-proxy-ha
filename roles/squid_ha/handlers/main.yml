---
- name: restart keepalived
  service:
    name: keepalived
    state: restarted

- name: Update CA certificates
  ansible.builtin.command: update-ca-certificates
  notify: restart squid

- name: restart squid
  service:
    name: squid
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes

- name: restart squid-exporter
  ansible.builtin.systemd:
    name: prometheus-squid-exporter
    state: restarted
    enabled: yes
    daemon_reload: yes
